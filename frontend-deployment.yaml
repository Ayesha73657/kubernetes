apiVersion: v1
kind: Namespace
metadata: 
  name: aifashion-ns
...  
apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend-deployment
  namespace: aifashion-ns
  labels:
    project: aifashion-app
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      project: aifashion-app
      tier: frontend-tier
  template:
    metadata:
      labels:
        project: aifashion-app
        tier: frontend-tier
    spec:  
      containers:
      - name: ai-frontend-app
        image: aishask/ai-frontend:latest
        ports:
        - containerPort: 80
...

apiVersion: v1
kind: Service
metadata:
  name: frontend-svc
  namespace: aifashion-ns
  labels: 
    project: aifashion-app
spec:
  type: NodePort
  selector:
    project: aifashion-app
    app: frontend
  ports:
  - port: 80
    targetPort: 80
    nodePort: 30080
    
