apiVersion: apps/v1
kind: Deployment
metadata: 
  name: frontend-deployment
  namespace: aifashion-ns
  labels:
    project: aifashion-app
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      project: aifashion-app
      tier: frontend-tier
  template:
    metadata:
      labels:
        project: aifashion-app
        tier: frontend-tier
    spec:  
      containers:
      - name: ai-frontend-app
        image: aishask/ai-frontend:latest
        ports:
        - containerPort: 80

    
